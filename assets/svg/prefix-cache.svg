<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 170" font-family="sans-serif">
  <rect width="460" height="170" rx="12" fill="#0d1117"/>
  <text x="230" y="26" fill="#8b949e" font-size="13" text-anchor="middle">প্রিফিক্স ক্যাশ = শুরুটা আবার কাজ না করা</text>
  <!-- request 1 -->
  <text x="60" y="62" fill="#8b949e" font-size="12" text-anchor="middle">Request ১</text>
  <rect x="20" y="72" width="120" height="26" rx="5" fill="#1f6feb"/>
  <text x="80" y="90" fill="#fff" font-size="11" text-anchor="middle">শুরু (কাজ হলো)</text>
  <!-- request 2 -->
  <text x="60" y="124" fill="#8b949e" font-size="12" text-anchor="middle">Request ২</text>
  <rect x="20" y="134" width="120" height="26" rx="5" fill="#238636"/>
  <text x="80" y="152" fill="#fff" font-size="11" text-anchor="middle">💾 cached (ফ্রি!)</text>
  <!-- arrow to cache -->
