  <rect x="185" y="78" width="100" height="74" rx="10" fill="#21262d" stroke="#3fb950" stroke-width="2"/>
  <text x="235" y="110" fill="#3fb950" font-size="24" text-anchor="middle">💾</text>
  <text x="235" y="134" fill="#8b949e" font-size="10" text-anchor="middle">শুরুটা মনে রাখা</text>
  <!-- savings -->
  <text x="375" y="100" fill="#3fb950" font-size="13" text-anchor="middle">💰 সময় + টাকা</text>
  <text x="375" y="120" fill="#3fb950" font-size="13" text-anchor="middle">বাঁচল!</text>
  <text x="230" y="50" fill="#f85149" font-size="10" text-anchor="middle">(শুরু বদলালে cache ভেঙে যায় 💔)</text>
