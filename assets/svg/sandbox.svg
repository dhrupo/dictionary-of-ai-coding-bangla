<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 160" font-family="sans-serif">
  <rect width="460" height="160" rx="12" fill="#0d1117"/>
  <text x="230" y="26" fill="#8b949e" font-size="13" text-anchor="middle">স্যান্ডবক্স = নিরাপদ বালির বাক্স 🏖️</text>
  <!-- sandbox walls -->
  <rect x="60" y="55" width="200" height="80" rx="10" fill="#d29922" opacity="0.25" stroke="#d29922" stroke-width="2"/>
  <text x="160" y="48" fill="#d29922" font-size="12" text-anchor="middle">🛡️ Sandbox</text>
  <text x="160" y="92" fill="#e6edf3" font-size="22" text-anchor="middle">🤖 💥</text>
  <text x="160" y="120" fill="#8b949e" font-size="11" text-anchor="middle">এজেন্ট যা খুশি ভাঙুক</text>
  <!-- outside world safe -->
  <line x1="280" y1="50" x2="280" y2="140" stroke="#30363d" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="370" y="88" fill="#3fb950" font-size="22" text-anchor="middle">🌍 ✅</text>
  <text x="370" y="116" fill="#8b949e" font-size="11" text-anchor="middle">বাইরের দুনিয়া</text>
  <text x="370" y="132" fill="#8b949e" font-size="11" text-anchor="middle">নিরাপদ</text>
</svg>
