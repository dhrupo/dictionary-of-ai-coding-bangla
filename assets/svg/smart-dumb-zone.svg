<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 160" font-family="sans-serif">
  <rect width="460" height="160" rx="12" fill="#0d1117"/>
  <text x="230" y="26" fill="#8b949e" font-size="13" text-anchor="middle">সেশন যত লম্বা, এজেন্ট তত ক্লান্ত 🔋</text>
  <!-- gradient bar -->
  <defs>
    <linearGradient id="zone" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="55%" stop-color="#d29922"/>
      <stop offset="100%" stop-color="#f85149"/>
    </linearGradient>
  </defs>
  <rect x="40" y="62" width="380" height="34" rx="17" fill="url(#zone)"/>
  <text x="95" y="84" fill="#0d1117" font-size="13" text-anchor="middle" font-weight="bold">🌟 Smart</text>
  <text x="365" y="84" fill="#0d1117" font-size="13" text-anchor="middle" font-weight="bold">🥴 Dumb</text>
  <!-- arrow -->
  <text x="40" y="124" fill="#3fb950" font-size="11">শুরু: তীক্ষ্ণ 🧠✨</text>
  <text x="300" y="124" fill="#f85149" font-size="11">পরে: এলোমেলো 😵</text>
  <text x="230" y="146" fill="#8b949e" font-size="11" text-anchor="middle">~১ লাখ টোকেনের পর ভোঁতা — তখন clear / compact করো</text>
</svg>
