<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 170" font-family="sans-serif">
  <rect width="460" height="170" rx="12" fill="#0d1117"/>
  <text x="230" y="26" fill="#8b949e" font-size="13" text-anchor="middle">মডেল = ইঞ্জিন · হার্নেস = গোটা গাড়ি</text>
  <!-- engine alone -->
  <rect x="40" y="70" width="70" height="46" rx="8" fill="#21262d" stroke="#8b949e" stroke-width="1.5"/>
  <text x="75" y="98" fill="#e6edf3" font-size="20" text-anchor="middle">⚙️</text>
  <text x="75" y="132" fill="#8b949e" font-size="11" text-anchor="middle">শুধু ইঞ্জিন</text>
  <text x="140" y="100" fill="#8b949e" font-size="20">→</text>
  <!-- car -->
  <g>
    <rect x="190" y="78" width="180" height="40" rx="10" fill="#1f6feb"/>
    <path d="M215 78 q20 -28 60 -28 h40 q25 0 35 28 z" fill="#388bfd"/>
    <text x="282" y="104" fill="#fff" font-size="18" text-anchor="middle">⚙️ 🧰</text>
    <circle cx="225" cy="122" r="14" fill="#161b22" stroke="#8b949e" stroke-width="3"/>
    <circle cx="335" cy="122" r="14" fill="#161b22" stroke="#8b949e" stroke-width="3"/>
  </g>
  <text x="282" y="150" fill="#8b949e" font-size="11" text-anchor="middle">ইঞ্জিন + চাকা + স্টিয়ারিং + ব্রেক</text>
  <text x="415" y="100" fill="#3fb950" font-size="18" text-anchor="middle">🚗💨</text>
</svg>
